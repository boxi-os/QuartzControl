# Packaging config. Until this existed the app could only be run from the repo with `npm run dev`,
# which is a different program from the one a user gets: a bundle started from the Dock or a
# desktop launcher inherits no shell PATH (see environmentService), so the packaged build is the
# only one that exercises that path at all.
#
# Windows is deliberately absent. The app is not ready for it - directory symlinks need elevated
# rights there (the Obsidian-vault feature), npx/npm are spawned through cmd.exe so free-text
# arguments would be reinterpreted, and rsync has no equivalent. Adding a `win:` block here would
# produce an installer for a version that does not work.

# `io.github.<nutzer>.<app>`, weil das Projekt auf GitHub liegt und keine eigene Domain trägt - und
# mit Unterstrich, weil Flathub genau diese Form für App-IDs erwartet und electron-builder die
# appId als Flatpak-App-ID durchreicht.
#
# **Diese Zeile ist nicht die ID, die auf macOS ankommt.** Apple erlaubt in `CFBundleIdentifier` nur
# Buchstaben, Ziffern, Bindestrich und Punkt; `filterCFBundleIdentifier`
# (app-builder-lib/out/appInfo.js:147, benutzt von `macBundleIdentifier`) wirft alles andere weg.
# Der Unterstrich fällt damit still heraus, und es gibt zwei Kennungen statt einer:
#
#   Linux / Flatpak   io.github.boxi_os.quartzcontrol   (am 2026-09-08 im gebauten Flatpak belegt)
#   macOS             io.github.boxios.quartzcontrol    (am 2026-09-09 im gebauten Bundle gemessen)
#
# Das ist kein Fehler und nicht zu vermeiden - eine appId ohne Unterstrich verlöre die Flathub-Form,
# eine mit behält sie dort und wird auf macOS gefiltert. Es steht hier, weil der Absatz darunter die
# Kosten eines ID-Wechsels beschreibt und diese Kosten auf macOS an der **gefilterten** Form hängen.
# Nachgemessen am 2026-09-09 auf der Maschine des Betreuers: `~/Library/Preferences` trägt
# `io.github.boxios.quartzcontrol.plist`, und LaunchServices führt sechs Registrierungen dieser Form
# gegen **null** der Unterstrich-Form. Wer auf macOS nach der App sucht - in TCC, in den
# Voreinstellungen, in `lsregister` -, sucht ohne Unterstrich.
#
# Was der Wechsel weg von der alten Bundle-ID `de.<klarname>.quartzcontrol` gekostet hat, gemessen
# am 2026-09-09 auf der Maschine des Betreuers - klein, aber nicht nichts. (`<klarname>` steht
# für den bürgerlichen Namen, den `afc18e7` aus der App genommen hat; er gehört nicht in eine
# Datei, die mitreist. Wer die Messung nachvollziehen will, kennt ihn.)
#
#   - Das Wichtigste bleibt: `app.getPath('userData')` hängt am Produktnamen, nicht an der ID,
#     also bleiben bestehende Profile, wo sie sind (nachgesehen:
#     `~/Library/Application Support/QuartzControl`).
#   - Unter macOS bleibt liegen, was *doch* an der ID hängt:
#     `~/Library/Preferences/de.<klarname>.quartzcontrol.plist` (Größe und letztes Verzeichnis
#     des Datei-Dialogs) beginnt unter der neuen ID bei null, und LaunchServices führt weiter
#     sieben Registrierungen der alten Haupt-ID plus vier Helper-IDs - die Datenbank kennt danach
#     zwei Programme desselben Namens.
#   - Nicht messbar ohne Vollzugriff, aber gelesen: TCC führt Ordnerfreigaben („Dokumente",
#     „Schreibtisch" - beides Orte, an denen Projekte und Vaults liegen) je Bundle-ID. Wer der
#     0.1.0-DMG diese Freigabe erteilt hat, beantwortet die Frage unter der neuen ID noch einmal.
#   - Für **Flatpak** ist er dagegen wirklich kostenlos, und zwar nicht aus Zufall: dort *ist* das
#     Datenverzeichnis die ID (`~/.var/app/<appId>/`), und unter der alten existiert keines. Als
#     dieser Satz geschrieben wurde (2026-09-08, vormittags), war noch überhaupt kein Flatpak
#     gebaut; der erste entstand am Nachmittag desselben Tages - siehe den `flatpak:`-Abschnitt
#     weiter unten.
#   - Die App ist unsigniert, eine Signatur hängt also an keiner der beiden IDs.
appId: io.github.boxi_os.quartzcontrol
productName: QuartzControl
copyright: © boxi-os

directories:
  output: release
  buildResources: build

# electron-vite bundles the renderer and both Electron entry points into out/, but
# externalizeDepsPlugin leaves everything under `dependencies` as a runtime require - so those
# still have to travel. electron-builder includes production dependencies on its own; what is
# listed here is only the app's own output. build/icon.png is included because the main process
# resolves it at runtime through app.getAppPath() for the Linux/Windows window icon and the macOS
# Dock icon.
files:
  - out/**
  - build/icon.png
  - package.json
  - '!**/*.map'

# Neither travels inside the asar: npm reads and starts its own files, and the loader is handed to
# a child process as a plain path. `to:` flattens them next to the app, which is where
# nodeRuntime.ts looks first (process.resourcesPath) before falling back to the repo layout.
# npm needs two entries, not one, and that is not a style choice: createFilter() in
# app-builder-lib/out/util/filter.js returns false for the copy source's *own* `node_modules`
# child, unconditionally and before any pattern is consulted. With a single entry npm arrived as
# 4 MB instead of 16 and its npm-cli.js could not resolve a single dependency - visible only in
# the packaged app, since in development npm is resolved from the repo. Copied as its own source,
# that directory's children are below the rule and come along.
# Holt und spiegelt das architekturrichtige git-Bundle, bevor kopiert wird (scripts/before-pack.mjs).
beforePack: scripts/before-pack.mjs

extraResources:
  - from: node_modules/npm
    to: npm
  - from: node_modules/npm/node_modules
    to: npm/node_modules
  - from: resources/runtime
    to: runtime
  # git reist mit, damit ein neuer Nutzer nichts installieren muss - auf macOS wären das sonst die
  # Xcode-Kommandozeilenwerkzeuge, mehrere Gigabyte für einen Klon. Benutzt wird es nur, wenn auf
  # dem Rechner kein funktionierendes git liegt (gitRuntime.ts).
  - from: resources/git/current
    to: git
  # Die Beispielvorlage als Reserve. Beim Anlegen eines Projekts holt die App zuerst die Fassung von
  # GitHub (builtinTemplateService) - diese hier ist die, die ohne Netz funktioniert und die ein
  # erster Start benutzt, weil noch nichts geladen wurde.
  - from: resources/templates
    to: templates
  - from: resources/licenses
    to: licenses
  # Der Lizenztext der App selbst, aus der einen Datei im Wurzelverzeichnis - nicht als zweite Kopie
  # unter resources/licenses. GPLv3 §4 verlangt, dass er die Binärdatei begleitet, und `licenses/`
  # ist das Verzeichnis, in dem ihn jemand sucht; `resources/licenses/README.txt` verweist darauf.
  - from: LICENSE
    to: licenses/QuartzControl-LICENSE.txt
  # Das Benutzerhandbuch als gebaute Website (npm run build:handbook; 437 Dateien / 34,9 MB am
  # 2026-09-09, die Zahl wächst mit dem Handbuch). Es
  # reist mit statt als Link, damit es ohne Netz lesbar ist und immer zu der Fassung passt, die
  # gerade installiert ist. Wie resources/git nicht im Repo, sondern beim Packen erzeugt - hier
  # aber ohne Netz, aus dem Handbuch-Projekt (docs/handbuch.md). Fehlt es, packt beforePack mit
  # einer Warnung weiter und der Menüpunkt sagt es.
  - from: resources/handbook
    to: handbook

asar: true
# Nothing here compiles against Electron's headers - ssh2 falls back to its pure-JS crypto when
# the optional native binding is absent - so a rebuild would only be a slow way to fail.
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Developer ID certificate, so the bundle is left unsigned rather than signed with an ad-hoc
  # identity that Gatekeeper treats no better. Consequence for whoever installs it: macOS refuses
  # the first launch until the quarantine flag is cleared
  # (`xattr -dr com.apple.quarantine /Applications/QuartzControl.app`) or the app is opened once
  # from the context menu. Set an identity here once a certificate exists; notarisation is a
  # separate step after that.
  identity: null
  # Chromiums Lizenzliste, 19 MB, nur hier. Electron liefert sie als `LICENSES.chromium.html` in
  # seinem dist aus; im **Linux**-Bau legt electron-builder sie von selbst neben das Programm
  # (nachgesehen in `release/linux-unpacked`: `LICENSE.electron.txt` und `LICENSES.chromium.html`),
  # in ein `.app`-Bundle nicht - das ist sein Normalverhalten und bei fast jeder Electron-App so.
  # Ein globaler `extraResources`-Eintrag würde sie unter Linux ein zweites Mal einpacken, deshalb
  # steht sie unter `mac:`. Das ist kein Ersetzen, sondern ein Anhängen: `getFileMatchers`
  # (app-builder-lib/out/fileMatcher.js) ruft `addPatterns(config[name])` und danach
  # `addPatterns(options.customBuildOptions[name])`, plattformspezifische Einträge kommen also zu
  # den globalen dazu.
  #
  # Die Quelle ist das dist der **Entwicklungs**-Abhängigkeit, nicht das heruntergeladene Paket der
  # Zielarchitektur. Das trägt, weil electron-builder genau die Fassung packt, die als `electron`
  # in `package.json` steht (beide 43.4.1, nachgesehen am 2026-09-09) - und die Lizenzliste hängt
  # an der Chromium-Fassung, nicht an der Architektur. Zieht jemand `electron` hoch, wandert die
  # Datei mit; das ist derselbe Weg, den `node_modules/npm` schon geht.
  extraResources:
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: licenses/LICENSES.chromium.html

dmg:
  # Just the app and a link to /Applications. The background is not named here on purpose:
  # dmg-builder looks for background.png in buildResources before it falls back to its own template
  # (dmgUtil.js, computeBackground), and build/background.png plus its @2x sibling are what it
  # finds. Leaving it unset is *not* "no background" - that is the case that pulls the template in,
  # a grey field with a dashed box and a dashed arrow that sit nowhere near the two positions
  # below, which is exactly what the 0.1.0 DMG shipped.
  #
  # Drawn by scripts/dmg-background.mjs. It does **not** read these numbers - it holds its own copy
  # (APP_X, LINK_X, ICON_Y), because reading them would need a YAML parser and js-yaml is only in
  # this tree transitively, under electron-builder. So the two lists are kept equal by hand and
  # nothing compares them: whoever moves an x here moves it there too, or the icons land beside the
  # shapes drawn for them. The window size is *not* a second copy - dmg-builder reads it out of the
  # background image (dmgUtil.js, `sips` on the folded TIFF), which is why there is no dmg.window
  # block here.
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

linux:
  category: Development
  icon: build/icon.png
  # deb refuses to build without a maintainer carrying an address; AppImage does not care. Change
  # this if the package is ever handed to someone else.
  maintainer: boxi-os <boxi@borkel.net>
  synopsis: Manage Quartz websites
  # Without this the installed .desktop file is named after `name` in package.json while the window
  # Electron opens identifies itself as QuartzControl, so a desktop environment cannot connect the
  # running window to its launcher: the taskbar shows a generic icon and "pin to dock" pins
  # nothing. syncDesktopName derives the filename from `desktopName` in package.json instead, which
  # is electron-builder's own fix for this (electron-userland/electron-builder#9103) and becomes
  # the default in v27.
  #
  # It stays on although `name` is no longer the reason it was needed. The measurement behind this
  # paragraph was taken while `name` was still the old working title `quartz-gui`, so the two
  # halves genuinely disagreed (`quartz-gui.desktop` against a window calling itself
  # QuartzControl); since `name` became `quartzcontrol` the default would land on the same filename
  # anyway. Removing the line would make the match depend on two fields staying equal by accident -
  # and `name` is what the deb package and the Linux binary are called, so it is not a field that
  # exists to serve the launcher.
  syncDesktopName: true
  # Zwei Architekturen, ausgeschrieben wie bei mac: - die Kurzform `- AppImage` heißt bei
  # electron-builder "Architektur der Baumaschine", und die ist hier eine aarch64-VM, also gab es
  # für x86_64 gar kein Paket. Cross ist für diese beiden Ziele gedeckt und kostet nichts:
  # `before-pack.mjs` liest die *Ziel*-Architektur aus `context.arch` und holt das passende
  # git-Bundle (fetch-git.mjs kennt linux-x64), electron-builder lädt die Electron-Binärdatei der
  # Zielarchitektur selbst, `npmRebuild: false` heißt, dass nichts kompiliert wird, und
  # app-builder-lib trennt in toolsets/linux.js ausdrücklich Host- von Zielarchitektur
  # ("mksquashfs/desktop-file-validate are HOST binaries").
  #
  # Ein einzelner Lauf geht **nicht** über `npm run dist:linux -- --x64`: Das Flag allein baut
  # beide Architekturen. Gemessen am 2026-09-09 an `computeArchToTargetNamesMap`
  # (app-builder-lib/out/targets/targetFactory.js) mit dieser Konfiguration und den Zielkarten,
  # die `Platform.LINUX.createTarget` für die jeweilige Kommandozeile liefert:
  #
  #   --linux                      → arm64: AppImage, deb · x64: AppImage, deb
  #   --linux --x64                → x64: AppImage, deb · arm64: AppImage, deb
  #   --linux AppImage deb --x64   → x64: AppImage, deb
  #
  # Der Grund steht in der Funktion: Die Kommandozeile liefert `--x64` als Karte `{x64: []}`, und
  # weil darin keine Zielnamen stehen, gilt sie nur als *Vorgabe* für Zielangaben ohne eigene
  # Architektur (`archs == null ? defaultArchs : asArray(archs)`). Die beiden Einträge unten haben
  # aber eine eigene, und die gewinnt. Einen einzelnen Lauf gibt es also nur, wenn man die Ziele
  # mitnennt — dann greift die Regel weiter unten, dass ein Ziel auf der Kommandozeile die Liste
  # ersetzt, und die Architektur daneben wirkt:
  # `npm run dist:linux -- AppImage deb --x64`.
  target:
    - target: AppImage
      arch: [arm64, x64]
    - target: deb
      arch: [arm64, x64]
  # flatpak steht bewusst nicht in dieser Liste: das Ziel braucht flatpak und flatpak-builder auf
  # der Baumaschine, und `npm run dist:linux` soll auf einem Rechner ohne die beiden nicht
  # scheitern. Gebaut wird es mit `npm run dist:flatpak`. Es ist zugleich das eine Linux-Ziel, das
  # sich *nicht* cross bauen lässt: flatpak-builder braucht Runtime, SDK und BaseApp der
  # Zielarchitektur und kompiliert das git-Modul unten aus der Quelle. Ein x86_64-Flatpak entsteht
  # also nur auf einer x86_64-Maschine.

# Der Name sagt die Architektur, auch bei x64. electron-builders Vorgabe für AppImage hängt das
# Architektursuffix nur an, wenn es *nicht* x64 ist (`isUseArchIfX64`), also stand
# `QuartzControl-1.0.0-beta.1.AppImage` neben `QuartzControl-1.0.0-beta.1-arm64.AppImage` — auf
# einer Release-Seite zwei Dateien nebeneinander, von denen nur eine sagt, wofür sie ist. Beim deb
# stellt sich die Frage nicht: fpm schreibt Debians eigene Namen (amd64/arm64) ohnehin in den
# Dateinamen, und beim Flatpak tut flatpak dasselbe mit x86_64/aarch64.
#
# `${arch}` ist dabei nicht Node's Wort für die Architektur, sondern das des Formats:
# `getArtifactArchName` (builder-util/out/arch.js) gibt für ein AppImage bei x64 **x86_64** aus,
# lässt arm64 aber **arm64** — "aarch64" gilt dort nur für pacman, rpm und flatpak. Der arm64-Name
# ändert sich durch diese Zeile also nicht; gemessen ist die x64-Hälfte am 2026-09-09
# (`QuartzControl-1.0.0-beta.1-x86_64.AppImage`), die arm64-Hälfte an derselben Funktion gelesen,
# die diese Messung erzeugt hat. Nebenbei gelernt: ein Ziel auf der Kommandozeile
# (`electron-builder --linux AppImage`) ersetzt die Zielliste **samt** Architekturen und baut nur
# für den Host - wer beide will, nimmt `npm run dist:linux`.
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Flatpak ist die einzige Auslieferungsform, in der die eingebettete Laufzeit aus Phase 7a nicht
# Komfort ist, sondern Voraussetzung: in der Sandbox gibt es kein Host-Node, und
# `flatpak-spawn --host` wäre kein Ausweg, sondern ein Sandbox-Ausbruch.
#
# Am 2026-09-08 zum ersten Mal wirklich gebaut, auf einer Debian-13-VM (aarch64, GNOME auf
# Wayland): Paket entsteht, installiert sich unter der appId, startet, und in der Sandbox antworten
# der node-Shim, das mitgelieferte npm und /app/bin/git. Bis dahin war dieser Abschnitt aus den
# Quellen abgeleitet (app-builder-lib/out/targets/FlatpakTarget.js) und aus den Manifesten der
# BaseApp. Die Baumaschine braucht flatpak-builder *und* flathub als user-Remote - siehe
# docs/decisions/electron-runtime-and-packaging.md.
flatpak:
  # electron-builders Vorgaben sind von 2020 (Runtime 20.08). 25.08 statt 24.08, weil dieser Zweig
  # der BaseApp aktiv gepflegt wird (letzter Commit April 2026 gegen September 2024) und weil er
  # **libsecret** als SDK-Erweiterung führt, wo 24.08 noch libgnome-keyring hatte - safeStorage
  # hängt unter Linux genau daran, und ein fehlender Schlüsselbund heißt hier: Zugangsdaten im
  # Klartext, sichtbar im Warnband der Startseite.
  runtimeVersion: '25.08'
  baseVersion: '25.08'

  # Ersetzt die Vorgabeliste vollständig, deshalb steht hier auch das Selbstverständliche.
  # Weggelassen gegenüber der Vorgabe: --socket=pulseaudio (die App gibt keinen Ton aus) und
  # --talk-name=org.freedesktop.Notifications (sie schickt keine Systemmeldungen).
  finishArgs:
    - --share=ipc
    - --socket=wayland
    - --socket=fallback-x11
    - --device=dri
    # Projekte, Vaults und Schlüsseldateien liegen im Zuhause des Nutzers. Ein Content-Ordner ist
    # oft ein Symlink in einen Obsidian-Vault - zeigt der auf ein anderes Laufwerk, sieht die
    # Sandbox ihn nicht, und der Nutzer braucht ein `flatpak override --filesystem=…`.
    - --filesystem=home
    # Klonen, Veröffentlichen, Marktplatz.
    - --share=network
    # safeStorage: ohne diesen Namen fällt Electron auf basic_text zurück, und das ist praktisch
    # Klartext (siehe connectionsService.getSecretStorageInfo).
    - --talk-name=org.freedesktop.secrets

  # git *muss* hier aus der Quelle gebaut werden, und das ist gemessen, nicht befürchtet: das
  # mitgelieferte Linux-git (Phase 7c) bringt keine einzige Bibliothek mit, und sein
  # `git-remote-http` hängt an libcurl-gnutls.so.4 - ein SONAME, den Debian und Ubuntu haben, die
  # freedesktop-Runtime aber nicht. In der Sandbox käme es also bis `git --version` und würde beim
  # ersten `clone` scheitern. Dieselbe Fassung wie das Bundle, damit es nur eine Zahl gibt.
  # NO_GETTEXT passt zum ausgedünnten Bundle (dort sind die Übersetzungen ebenfalls weg), NO_PERL
  # und NO_PYTHON werfen Kommandos raus, die diese App nie aufruft (send-email, svn, p4).
  modules:
    - name: git
      buildsystem: simple
      build-commands:
        - make prefix=/app NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 INSTALL_SYMLINKS=1 -j$FLATPAK_BUILDER_N_JOBS all
        - make prefix=/app NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 INSTALL_SYMLINKS=1 install
      sources:
        - type: archive
          url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.53.0.tar.xz
          sha256: 5818bd7d80b061bbbdfec8a433d609dc8818a05991f731ffc4a561e2ca18c653
