# Packaging config. Until this existed the app could only be run from the repo with `npm run dev`,
# which is a different program from the one a user gets: a bundle started from the Dock or a
# desktop launcher inherits no shell PATH (see environmentService), so the packaged build is the
# only one that exercises that path at all.
#
# Windows is deliberately absent. The app is not ready for it - directory symlinks need elevated
# rights there (the Obsidian-vault feature), npx/npm are spawned through cmd.exe so free-text
# arguments would be reinterpreted, and rsync has no equivalent. Adding a `win:` block here would
# produce an installer for a version that does not work.
appId: de.holgerborker.quartzcontrol
productName: QuartzControl
copyright: © Holger Borker

directories:
  output: release
  buildResources: build

# electron-vite bundles the renderer and both Electron entry points into out/, but
# externalizeDepsPlugin leaves everything under `dependencies` as a runtime require - so those
# still have to travel. electron-builder includes production dependencies on its own; what is
# listed here is only the app's own output. build/icon.png is included because the main process
# resolves it at runtime through app.getAppPath() for the Linux/Windows window icon and the macOS
# Dock icon.
files:
  - out/**
  - build/icon.png
  - package.json
  - '!**/*.map'

# Neither travels inside the asar: npm reads and starts its own files, and the loader is handed to
# a child process as a plain path. `to:` flattens them next to the app, which is where
# nodeRuntime.ts looks first (process.resourcesPath) before falling back to the repo layout.
# npm needs two entries, not one, and that is not a style choice: createFilter() in
# app-builder-lib/out/util/filter.js returns false for the copy source's *own* `node_modules`
# child, unconditionally and before any pattern is consulted. With a single entry npm arrived as
# 4 MB instead of 16 and its npm-cli.js could not resolve a single dependency - visible only in
# the packaged app, since in development npm is resolved from the repo. Copied as its own source,
# that directory's children are below the rule and come along.
# Holt und spiegelt das architekturrichtige git-Bundle, bevor kopiert wird (scripts/before-pack.mjs).
beforePack: scripts/before-pack.mjs

extraResources:
  - from: node_modules/npm
    to: npm
  - from: node_modules/npm/node_modules
    to: npm/node_modules
  - from: resources/runtime
    to: runtime
  # git reist mit, damit ein neuer Nutzer nichts installieren muss - auf macOS wären das sonst die
  # Xcode-Kommandozeilenwerkzeuge, mehrere Gigabyte für einen Klon. Benutzt wird es nur, wenn auf
  # dem Rechner kein funktionierendes git liegt (gitRuntime.ts).
  - from: resources/git/current
    to: git
  # Die Beispielvorlage als Reserve. Beim Anlegen eines Projekts holt die App zuerst die Fassung von
  # GitHub (builtinTemplateService) - diese hier ist die, die ohne Netz funktioniert und die ein
  # erster Start benutzt, weil noch nichts geladen wurde.
  - from: resources/templates
    to: templates
  - from: resources/licenses
    to: licenses
  # Das Benutzerhandbuch als gebaute Website (npm run build:handbook, 252 Dateien / 18 MB). Es
  # reist mit statt als Link, damit es ohne Netz lesbar ist und immer zu der Fassung passt, die
  # gerade installiert ist. Wie resources/git nicht im Repo, sondern beim Packen erzeugt - hier
  # aber ohne Netz, aus dem Handbuch-Projekt (docs/handbuch.md). Fehlt es, packt beforePack mit
  # einer Warnung weiter und der Menüpunkt sagt es.
  - from: resources/handbook
    to: handbook

asar: true
# Nothing here compiles against Electron's headers - ssh2 falls back to its pure-JS crypto when
# the optional native binding is absent - so a rebuild would only be a slow way to fail.
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Developer ID certificate, so the bundle is left unsigned rather than signed with an ad-hoc
  # identity that Gatekeeper treats no better. Consequence for whoever installs it: macOS refuses
  # the first launch until the quarantine flag is cleared
  # (`xattr -dr com.apple.quarantine /Applications/QuartzControl.app`) or the app is opened once
  # from the context menu. Set an identity here once a certificate exists; notarisation is a
  # separate step after that.
  identity: null

dmg:
  # Just the app and a link to /Applications - the default background image ships with
  # electron-builder and would put someone else's artwork on this window.
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

linux:
  category: Development
  icon: build/icon.png
  # deb refuses to build without a maintainer carrying an address; AppImage does not care. Change
  # this if the package is ever handed to someone else.
  maintainer: Holger Borker <mail@holgerborker.de>
  synopsis: Manage Quartz websites
  # Without this the installed .desktop file is named after `name` in package.json
  # (quartz-gui.desktop) while the window Electron opens identifies itself as QuartzControl, so a
  # desktop environment cannot connect the running window to its launcher: the taskbar shows a
  # generic icon and "pin to dock" pins nothing. syncDesktopName derives the filename from
  # `desktopName` in package.json instead, which is electron-builder's own fix for this
  # (electron-userland/electron-builder#9103) and becomes the default in v27.
  syncDesktopName: true
  target:
    - AppImage
    - deb
  # flatpak steht bewusst nicht in dieser Liste: das Ziel braucht flatpak und flatpak-builder auf
  # der Baumaschine, und `npm run dist:linux` soll auf einem Rechner ohne die beiden nicht
  # scheitern. Gebaut wird es mit `npm run dist:flatpak`.

# Flatpak ist die einzige Auslieferungsform, in der die eingebettete Laufzeit aus Phase 7a nicht
# Komfort ist, sondern Voraussetzung: in der Sandbox gibt es kein Host-Node, und
# `flatpak-spawn --host` wäre kein Ausweg, sondern ein Sandbox-Ausbruch.
#
# NICHT AUF DIESEM RECHNER GEMESSEN - flatpak-builder läuft nur unter Linux. Was hier steht, ist
# aus den Quellen abgeleitet (app-builder-lib/out/targets/FlatpakTarget.js) und aus den Manifesten
# der BaseApp; der erste echte Build gehört auf eine Linux-Maschine, und bis dahin ist dieser
# Abschnitt eine begründete Vermutung.
flatpak:
  # electron-builders Vorgaben sind von 2020 (Runtime 20.08). 25.08 statt 24.08, weil dieser Zweig
  # der BaseApp aktiv gepflegt wird (letzter Commit April 2026 gegen September 2024) und weil er
  # **libsecret** als SDK-Erweiterung führt, wo 24.08 noch libgnome-keyring hatte - safeStorage
  # hängt unter Linux genau daran, und ein fehlender Schlüsselbund heißt hier: Zugangsdaten im
  # Klartext, sichtbar im Warnband der Startseite.
  runtimeVersion: '25.08'
  baseVersion: '25.08'

  # Ersetzt die Vorgabeliste vollständig, deshalb steht hier auch das Selbstverständliche.
  # Weggelassen gegenüber der Vorgabe: --socket=pulseaudio (die App gibt keinen Ton aus) und
  # --talk-name=org.freedesktop.Notifications (sie schickt keine Systemmeldungen).
  finishArgs:
    - --share=ipc
    - --socket=wayland
    - --socket=fallback-x11
    - --device=dri
    # Projekte, Vaults und Schlüsseldateien liegen im Zuhause des Nutzers. Ein Content-Ordner ist
    # oft ein Symlink in einen Obsidian-Vault - zeigt der auf ein anderes Laufwerk, sieht die
    # Sandbox ihn nicht, und der Nutzer braucht ein `flatpak override --filesystem=…`.
    - --filesystem=home
    # Klonen, Veröffentlichen, Marktplatz.
    - --share=network
    # safeStorage: ohne diesen Namen fällt Electron auf basic_text zurück, und das ist praktisch
    # Klartext (siehe connectionsService.getSecretStorageInfo).
    - --talk-name=org.freedesktop.secrets

  # git *muss* hier aus der Quelle gebaut werden, und das ist gemessen, nicht befürchtet: das
  # mitgelieferte Linux-git (Phase 7c) bringt keine einzige Bibliothek mit, und sein
  # `git-remote-http` hängt an libcurl-gnutls.so.4 - ein SONAME, den Debian und Ubuntu haben, die
  # freedesktop-Runtime aber nicht. In der Sandbox käme es also bis `git --version` und würde beim
  # ersten `clone` scheitern. Dieselbe Fassung wie das Bundle, damit es nur eine Zahl gibt.
  # NO_GETTEXT passt zum ausgedünnten Bundle (dort sind die Übersetzungen ebenfalls weg), NO_PERL
  # und NO_PYTHON werfen Kommandos raus, die diese App nie aufruft (send-email, svn, p4).
  modules:
    - name: git
      buildsystem: simple
      build-commands:
        - make prefix=/app NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 INSTALL_SYMLINKS=1 -j$FLATPAK_BUILDER_N_JOBS all
        - make prefix=/app NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 INSTALL_SYMLINKS=1 install
      sources:
        - type: archive
          url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.53.0.tar.xz
          sha256: 5818bd7d80b061bbbdfec8a433d609dc8818a05991f731ffc4a561e2ca18c653
