<style>
  /* Der Kasten steht nur auf der Startseite und nur in der Web-Fassung, deshalb sein Aussehen
     hier statt in einem Stylesheet der Vorlage: So übersteht er einen Neu-Import von doku.qtpl,
     der custom.scss vollständig ersetzt. Dasselbe Muster wie die style-Instanz des Example.
     Alle Farben und Maße kommen aus den Variablen der Vorlage — es entsteht kein Farbpaar,
     das nicht schon gemessen wurde. */
  /* Der beforeBody-Bereich ist ein Flex-Container mit gap 0 - ohne diese beiden Ränder klebt der
     Kasten am Versionsband und das Band am Titel. Der Abstand nach unten ist der kleinere, weil
     Kasten und Band zusammengehören; die Luft vor dem Titel setzt das Band (version.html). */
  .layout-box-download { margin-block-end: var(--tpl-space-md); }
  .layout-box-download .dl {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--tpl-space-md);
    padding: var(--tpl-space-lg);
    border: var(--tpl-rule-width) solid var(--tpl-rule);
    border-radius: var(--tpl-radius-lg);
    background: var(--tpl-surface);
  }
  .layout-box-download .dl-text { flex: 1 1 16rem; }
  .layout-box-download .dl-lead {
    margin: 0;
    font-size: var(--tpl-text-lg);
    font-weight: 600;
    line-height: var(--tpl-leading-snug);
  }
  .layout-box-download .dl-note {
    margin: var(--tpl-space-2xs) 0 0;
    font-size: var(--tpl-text-sm);
    color: var(--gray);
    line-height: var(--tpl-leading-normal);
  }
  .layout-box-download .dl-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: var(--tpl-target);
    padding: 0 var(--tpl-space-lg);
    border: var(--tpl-rule-width) solid var(--tpl-rule-strong);
    border-radius: var(--tpl-radius-md);
    background: var(--tpl-surface-tint);
    color: var(--secondary);
    font-weight: 600;
    text-decoration: none;
  }
  .layout-box-download .dl-button:hover { background: var(--lightgray); }
</style>
<div class="dl">
  <div class="dl-text">
    <p class="dl-lead">QuartzControl für macOS und Linux</p>
    <p class="dl-note">
      Fassung 1.0.0-beta.1 · DMG und zip für macOS (arm64 und x64), AppImage, deb und Flatpak für
      Linux. Warum es kein Windows gibt, steht unter <a href="{{root}}/systemvoraussetzungen">Systemvoraussetzungen</a>.
    </p>
  </div>
  <a class="dl-button" href="https://github.com/boxi-os/QuartzControl/releases">Herunterladen</a>
</div>
