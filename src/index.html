<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- frame-src is exactly one thing: the live preview of the project's own dev server, which
         runs on http://localhost:<port>. Without it `default-src 'self'` blocks the iframe (a
         file:// document framing http:// is not "self"). Deliberately not widened to the
         remoteDevHost - that is a tunnel to somewhere else, and the preview falls back to the
         external link for it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com; frame-src http://localhost:* http://127.0.0.1:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuartzControl</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
